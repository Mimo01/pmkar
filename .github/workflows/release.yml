name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.create_release.outputs.id }}
      changelog: ${{ steps.changelog.outputs.content }}
      should_build: ${{ steps.check_existing.outputs.should_build }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if release already exists
        id: check_existing
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://api.github.com/repos/Mimo01/pmkar-releases/releases/tags/${{ github.ref_name }}")
          if [ "$STATUS" = "200" ]; then
            echo "Release ${{ github.ref_name }} already exists — skipping"
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate changelog
        if: steps.check_existing.outputs.should_build == 'true'
        id: changelog
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip header

      - name: Create release on public repo
        if: steps.check_existing.outputs.should_build == 'true'
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          repository: Mimo01/pmkar-releases
          tag_name: ${{ github.ref_name }}
          name: 'pmkar ${{ github.ref_name }}'
          body: ${{ steps.changelog.outputs.content || 'See release assets for download.' }}
          draft: false
          prerelease: false
          token: ${{ secrets.RELEASES_REPO_PAT }}

  build-tauri:
    needs: create-release
    if: needs.create-release.outputs.should_build == 'true'
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target universal-apple-darwin'
            rust_targets: 'aarch64-apple-darwin,x86_64-apple-darwin'
          - platform: ubuntu-22.04
            args: ''
            rust_targets: ''
          - platform: windows-latest
            args: ''
            rust_targets: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASES_REPO_PAT }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          owner: Mimo01
          repo: pmkar-releases
          tagName: ${{ github.ref_name }}
          releaseName: 'pmkar ${{ github.ref_name }}'
          releaseBody: ${{ needs.create-release.outputs.changelog || '' }}
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

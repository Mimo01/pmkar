[package]
name = "pmkar"
version = "0.1.0"
edition = "2021"

[lib]
name = "pmkar_lib"
crate-type = ["lib", "cdylib", "staticlib"]
path = "src/lib.rs"

[[bin]]
name = "pmkar"
path = "src/main.rs"

[dependencies]
tauri = { version = "2.10", features = ["devtools"] }
tauri-build = { version = "2.0", features = [] }
axum = "0.8"
keyring = { version = "3.6", features = ["apple-native", "windows-native", "linux-native-sync-persistent"] }
rusqlite = { version = "0.39", features = ["bundled"] }
reqwest = { version = "0.13", features = ["json", "multipart"] }
htmltoadf = "0.1.12"
reqwest-middleware = "0.5"
http = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"
thiserror = "2"
base64 = "0.22"
urlencoding = "2"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[features]
default = ["mock-server"]
mock-server = []

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- 1024x1024 canvas with ~100px transparent padding for macOS Dock compliance -->

  <!-- White rounded square background -->
  <rect x="100" y="100" width="824" height="824" rx="180" ry="180" fill="#ffffff"/>

  <!-- "pmkar" text centered — "pm" in brand red, "kar" in dark -->
  <!-- font-semibold tracking-tight style, matching AppShell header -->
  <text x="512" y="540" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Helvetica, Arial, sans-serif" font-size="195" font-weight="600" letter-spacing="-4">
    <tspan fill="#c02232">pm</tspan><tspan fill="#231f20">kar</tspan>
  </text>
</svg>

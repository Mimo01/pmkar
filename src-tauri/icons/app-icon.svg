<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg-gradient" x1="0" y1="0" x2="1024" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a01c2a"/>
      <stop offset="100%" stop-color="#c02232"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background with gradient -->
  <rect width="1024" height="1024" rx="220" ry="220" fill="url(#bg-gradient)"/>
  <!-- Vertical stem of P -->

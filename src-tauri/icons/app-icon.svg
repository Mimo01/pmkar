<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- 1024x1024 canvas with transparent padding (~100px each side) for macOS Dock compliance -->
  <!-- Visible icon area: 824x824 centered -->

  <!-- White rounded square background — macOS superellipse style (~22% corner radius of icon area) -->
  <rect x="100" y="100" width="824" height="824" rx="180" ry="180" fill="#ffffff"/>

  <!-- Bold geometric "P" in brand red — thick strokes for 16x16 legibility -->
  <!-- Stem -->
  <rect x="345" y="275" width="115" height="474" rx="6" fill="#c02232"/>

  <!-- Bowl (outer) -->
  <path d="M 345,275 L 545,275 A 160,160 0 0 1 545,565 L 345,565 Z" fill="#c02232"/>

  <!-- Bowl cutout (white interior) -->
  <path d="M 460,355 L 530,355 A 82,82 0 0 1 530,485 L 460,485 Z" fill="#ffffff"/>
</svg>
